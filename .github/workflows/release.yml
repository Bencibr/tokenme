name: release
on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tokenme-bar/pnpm-lock.yaml
      - run: ./scripts/build-macos.sh
      - name: Stage artifacts
        run: |
          B=apps/tokenme-bar/src-tauri/target/release/bundle
          cd "$B/macos" && ditto -c -k --keepParent tokenme.app ../../../../tokenme-macos-arm64.app.zip
          cd "$B/dmg" && cp tokenme_*.dmg ../../../../
          cd "$GITHUB_WORKSPACE" && shasum -a 256 tokenme-macos-arm64.app.zip tokenme_*.dmg > sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tokenme-macos-arm64.app.zip
            tokenme_*.dmg
            sha256.txt
            latest.json
          generate_release_notes: true
