name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A spawn-flag check, not a build one: an unflagged console child of a GUI
      # process paints a window on Windows, and neither the compiler nor a test
      # can see it. Runs first because it is instant and names the file.
      - run: python3 scripts/check-no-window-spawns.py
      - run: cargo test --workspace --all-targets

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tokenme-bar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tokenme-bar/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
