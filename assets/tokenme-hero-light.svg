<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%" fill="none">
  <!-- Card Container with 24px Squircle Radius -->
  <rect x="2" y="2" width="956" height="296" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Subtle Dot Grid in Background -->
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#E2E8F0" />
    </pattern>
    <linearGradient id="tokenme-bg-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FC6A4"/>
      <stop offset="1" stop-color="#0C7F6C"/>
    </linearGradient>
    <radialGradient id="tokenme-sheen-light" cx="0.5" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="20" y="20" width="920" height="260" rx="16" fill="url(#grid-light)" opacity="0.6"/>

  <!-- Brand Mark Icon Box (72x72) - Official TokenMe Logo -->
  <g transform="translate(64, 60)">
    <rect width="72" height="72" rx="18" fill="url(#tokenme-bg-light)" stroke="#CCFBF1" stroke-width="1.5"/>
    <rect width="72" height="72" rx="18" fill="url(#tokenme-sheen-light)"/>
    <svg width="72" height="72" viewBox="0 0 1024 1024">
      <g transform="rotate(-40 512 512)">
        <circle cx="512" cy="512" r="248" fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round" pathLength="100" stroke-dasharray="72 28"/>
      </g>
      <g transform="rotate(-52 512 512)">
        <circle cx="512" cy="512" r="128" fill="none" stroke="#A5ECD6" stroke-width="64" stroke-linecap="round" pathLength="100" stroke-dasharray="42 58"/>
      </g>
    </svg>
  </g>

  <!-- Typography: Wordmark & Core Tagline -->
  <text x="156" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-1">TokenMe<tspan font-size="28" font-weight="500" fill="#0C7F6C"> Monitor</tspan></text>
  
  <text x="156" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B">Cross-tool AI coding token, cost &amp; quota monitor for engineers</text>

  <!-- Divider Line -->
  <line x1="64" y1="180" x2="896" y2="180" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Bottom Badges / Tech Capabilities -->
  <g transform="translate(64, 210)">
    <!-- Pill: Zero-Telemetry -->
    <rect x="0" y="0" width="158" height="34" rx="8" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#0C7F6C"/>
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0C7F6C">Zero-Telemetry</text>

    <!-- Pill: 10+ AI Tools -->
    <rect x="170" y="0" width="138" height="34" rx="8" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
    <circle cx="186" cy="17" r="4" fill="#0C7F6C"/>
    <text x="198" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0C7F6C">10+ AI Tools</text>

    <!-- Pill: Live Quota Probes -->
    <rect x="320" y="0" width="176" height="34" rx="8" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
    <circle cx="336" cy="17" r="4" fill="#0C7F6C"/>
    <text x="348" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0C7F6C">Live Quota Probes</text>

    <!-- Right Side Protocol Tag -->
    <text x="832" y="22" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="500" fill="#64748B">v0.1.0 · MIT License</text>
  </g>
</svg>