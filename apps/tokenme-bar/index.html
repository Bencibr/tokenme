<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>tokenme</title>
    <style>
      /* Keep the transparent window transparent before the stylesheet loads. */
      html {
        /* The Tauri window is transparent. An opaque html background would
           paint a square behind the rounded panel before CSS can clip it. */
        background: transparent;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: transparent;
          color-scheme: dark;
        }
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
