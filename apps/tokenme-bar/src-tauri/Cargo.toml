[package]
name = "tokenme"
version = "0.1.6"
description = "tokenme menu-bar token & cost monitor"
edition = "2021"
rust-version = "1.97"

# Deliberately its own cargo project: the root workspace `exclude`s this path so
# that the app's heavy Tauri dependency graph never blocks the core crates.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ureq = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time", "net", "sync"] }

tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

usage-core = { path = "../../../crates/usage-core" }
usage-index = { path = "../../../crates/usage-index" }
usage-adapter-all = { path = "../../../crates/adapters/all" }
usage-adapter-dsh = { path = "../../../crates/adapters/dsh" }
usage-adapter-codex = { path = "../../../crates/adapters/codex" }
usage-quota = { path = "../../../crates/usage-quota" }
# The `ring` backend keeps the Windows build NASM-free — the default
# `aws-lc-rs` wants an assembler this toolchain image does not ship.
russh = { version = "0.64", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }
russh-sftp = "3.0"
zeroize = "1"
rand = "0.10"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# The permission-query and auth-request entry points live here (`AuthorizationStatus`
# among them); notify-rust's UNC backend already pulls this crate, so naming the
# types directly adds no build weight.
mac-usernotifications = "0.3"

# Threshold banners. Deliberately not tauri-plugin-notification: on desktop that
# plugin's permission API is an empty stub, its `show` drops the delivery error,
# and its default macOS backend is the deprecated NSUserNotification path. The
# `preview-macos-un` feature puts notify-rust on UNUserNotificationCenter — the
# path this repo's spike proved delivers from an ad-hoc-signed bundle — and lets
# `show` return the real result, which the dedup state machine needs (a banner
# that failed to post must not be marked as fired). Windows rides the same
# crate's WinRT toast backend. The feature is inert off macOS.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = { version = "4", features = ["preview-macos-un"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The `test` feature brings `tauri::test` (mock app runtime) for the live
# server-pull E2E (src/servers/e2e.rs); production builds are unaffected.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.dev]
# The root workspace has said this since someone measured it, and it never reached
# here: `apps/tokenme-bar` is excluded from that workspace and carries its own, so
# cargo's default `debug = true` applied — full DWARF for every one of the ~130
# dependencies this app links, which is why `target/debug` grew to 16 GB against
# `target/release`'s 6.4 GB. Line tables keep panic line numbers, and that is the
# whole debugging path for this app: `panel.log`, `.ips` crash reports, and an
# unstripped release binary for `atos`. An incremental rebuild after touching one
# source file is the number this buys.
debug = "line-tables-only"

[profile.release]
# thin LTO + parallel codegen compiles several times faster than the old
# full-LTO single-unit setup, at near-identical size for this app; opt-level
# "s" keeps the size intent.
lto = "thin"
codegen-units = 16
opt-level = "s"
# Kept unstripped on purpose: a stripped binary cannot be symbolicated from
# its own .ips files (rebuilding with different flags shifts every offset —
# the 2026-09-29 SIGBUS hunt burned hours on exactly that). The local symbols
# cost ~2 MB and make every future crash report readable with plain atos.
strip = false
