<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 200 624 624">
  <!-- menu-bar glyph: verbatim monochrome trace of app-icon.svg's two
       progress rings (same radii, strokes, dasharrays, rotations) -->
  <g transform="rotate(-40 512 512)">
    <circle cx="512" cy="512" r="248" fill="none" stroke="#000000" stroke-width="74" stroke-linecap="round" pathLength="100" stroke-dasharray="72 28"/>
  </g>
  <g transform="rotate(-52 512 512)">
    <circle cx="512" cy="512" r="128" fill="none" stroke="#000000" stroke-width="64" stroke-linecap="round" pathLength="100" stroke-dasharray="42 58"/>
  </g>
</svg>
