[workspace]
resolver = "2"
members = ["sdk", "reference-plugin", "reference-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
debug = 0
strip = "debuginfo"
